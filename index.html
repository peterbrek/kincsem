<style>
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px)}
img{max-width:100%}
/* Layout: egyoszlopos telefonos app alsó tab-sávval. Legelőzöld alap, akadályléc-piros kiemelés, szénasárga díjak. */
:root{
  --bg:#EAF1E3; --surface:#FBFDF8; --surface-2:#DCE8D1; --ink:#1C3226; --ink-soft:#4E6555; --line:#C6D5BB;
  --accent:#D0442A; --accent-ink:#FFFFFF; --accent-soft:#F7DCD4;
  --gold:#C98A1E; --gold-soft:#F5E4BC;
  --sky:#CFE4EE; --sky-2:#E5F0E2; --grass:#8DBA6C; --shadow:rgba(28,50,38,.16); --horse-line:rgba(28,40,30,.55);
  --sand:#E9DCC0; --good:#21804A; --good-soft:#D4EEDC; --bad:#B5321D; --bad-soft:#F7D9D1;
  --font-display:"Fraunces", Georgia, "Times New Roman", serif;
  --font-body:"Nunito", -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111D17; --surface:#1A2A21; --surface-2:#24382B; --ink:#E4EEDF; --ink-soft:#A6BAAA; --line:#30473A;
    --accent:#FF7E61; --accent-ink:#2A0E07; --accent-soft:#4A241B;
    --gold:#F0BC55; --gold-soft:#41341A;
    --sky:#2F4C5A; --sky-2:#3A5953; --grass:#4A7843; --shadow:rgba(0,0,0,.35); --horse-line:rgba(5,10,8,.7);
    --sand:#3B3426; --good:#63CF8C; --good-soft:#173A2A; --bad:#FF8F7B; --bad-soft:#45211A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111D17; --surface:#1A2A21; --surface-2:#24382B; --ink:#E4EEDF; --ink-soft:#A6BAAA; --line:#30473A;
  --accent:#FF7E61; --accent-ink:#2A0E07; --accent-soft:#4A241B;
  --gold:#F0BC55; --gold-soft:#41341A;
  --sky:#2F4C5A; --sky-2:#3A5953; --grass:#4A7843; --shadow:rgba(0,0,0,.35); --horse-line:rgba(5,10,8,.7);
  --sand:#3B3426; --good:#63CF8C; --good-soft:#173A2A; --bad:#FF8F7B; --bad-soft:#45211A;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:12px}
p{margin:0}
ul,ol,dl{margin:0;padding:0}

.app{max-width:560px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:16px}

.display{font-family:var(--font-display);font-weight:800;font-variation-settings:"opsz" 96;font-size:2.2rem;line-height:1.04;letter-spacing:-.015em;margin:0;text-wrap:balance}
h2{font-family:var(--font-display);font-weight:800;font-variation-settings:"opsz" 48;font-size:1.35rem;line-height:1.15;margin:0;text-wrap:balance}
h3{font-family:var(--font-display);font-weight:800;font-variation-settings:"opsz" 24;font-size:1.06rem;line-height:1.15;margin:0;text-wrap:balance}
.eyebrow{font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 4px}
.soft{color:var(--ink-soft)}
.num{font-variant-numeric:tabular-nums}

.card{background:var(--surface);border:1px solid var(--line);border-radius:22px}
.pad{padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:1rem;text-align:center}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.55}
.btn-ghost{background:var(--surface-2);color:var(--ink)}
.btn-big{min-height:58px;font-size:1.1rem;width:100%}
.linkbtn{border:0;background:none;padding:8px 0;color:var(--accent);font-weight:800;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}

.stage{background:linear-gradient(var(--sky), var(--sky-2));overflow:hidden}
.stage svg{display:block;width:100%;height:auto}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px, env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px, env(safe-area-inset-left,0px));display:flex;justify-content:center}
.tabbar-inner{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));width:100%;max-width:560px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 4px;border:0;background:none;color:var(--ink-soft);font-weight:800;font-size:.68rem;line-height:1.2;border-radius:14px}
.tab svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] .tab-ico{background:var(--accent-soft)}
.tab-ico{display:grid;place-items:center;width:52px;height:32px;border-radius:999px}

/* Home */
.hello{display:flex;flex-direction:column;gap:2px;padding-top:6px}
.today{overflow:hidden}
.today .stage{aspect-ratio:6/5;max-height:300px}
.today .stage svg{height:100%;width:auto;margin:0 auto}
.today-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.stat-big{font-family:var(--font-display);font-weight:800;font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
.stat-big small{font-size:1rem;color:var(--ink-soft)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.factday{padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--gold-soft);border-color:transparent}
.factday .eyebrow{color:var(--ink)}
.factday p.big{font-size:1.12rem;font-weight:700;line-height:1.4}

.settings{padding:18px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:800;font-size:.92rem}
.input{min-height:48px;border:2px solid var(--line);border-radius:14px;background:var(--bg);padding:0 14px;width:100%}
.input:focus{border-color:var(--accent);outline:none}
.stepper{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;gap:8px}
.stepper button{border:0;border-radius:14px;background:var(--surface-2);font-size:1.4rem;font-weight:800;min-height:48px}
.stepper .input{text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.hint{font-size:.88rem;color:var(--ink-soft)}

/* Breeds */
.vhead{display:flex;flex-direction:column;gap:2px;padding-top:6px}
.search .input{background:var(--surface)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:40px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.count{font-size:.88rem;color:var(--ink-soft);font-weight:700;margin-top:-6px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:540px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.bcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;min-width:0}
.bcard-open{display:flex;flex-direction:column;width:100%;padding:0;border:0;background:none;text-align:left}
.bcard .stage{aspect-ratio:6/5}
.bcard-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.meta{font-size:.84rem;color:var(--ink-soft);line-height:1.3}
.seen{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:800;color:var(--gold);margin-top:2px}
.seen svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round}
.fav{position:absolute;top:8px;right:8px;width:40px;height:40px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;color:var(--ink-soft);box-shadow:0 1px 4px var(--shadow)}
.fav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.fav[aria-pressed="true"]{color:var(--accent)}
.fav[aria-pressed="true"] svg{fill:currentColor}
.bcard .fav{right:auto;left:8px}
.empty{grid-column:1/-1;padding:28px 18px;text-align:center;color:var(--ink-soft);font-weight:700}

/* Detail */
.back{display:inline-flex;align-items:center;gap:4px;align-self:flex-start;border:0;background:var(--surface-2);border-radius:999px;min-height:40px;padding:0 16px 0 10px;font-weight:800}
.back svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.stage-detail{border-radius:22px;aspect-ratio:6/5}
.d-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.d-head > div{min-width:0}
.d-head .fav{position:static;flex:0 0 auto;width:52px;height:52px}
.d-head .fav svg{width:26px;height:26px}
.origin{color:var(--ink-soft);font-weight:700;margin-top:6px}
.facts{display:grid;grid-template-columns:1fr;gap:0;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.facts > div{display:grid;grid-template-columns:118px minmax(0,1fr);gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.facts > div:first-child{border-top:0}
.facts dt{font-weight:800;font-size:.86rem;color:var(--ink-soft);padding-top:2px}
.facts dd{margin:0;font-weight:600}
.callout{background:var(--gold-soft);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:8px}
.callout p:first-of-type{font-weight:800;font-size:1.08rem;line-height:1.4}
.compare{padding:16px;display:flex;flex-direction:column;gap:10px}
.cmp{width:100%;height:auto;display:block;border-radius:14px;background:linear-gradient(var(--sky), var(--sky-2))}
.cmp .gl{stroke:var(--ink);stroke-opacity:.12;stroke-width:1}
.cmp .gt{font:700 9px var(--font-body);fill:var(--ink-soft)}
.cmp .gr{fill:var(--grass)}
.cmp .wl{stroke:var(--ink);stroke-width:1.4;stroke-dasharray:4 3}
.cmp .wd{fill:var(--ink)}
.cmp .lt{font:800 11px var(--font-body);fill:var(--ink)}
.girl{fill:var(--accent)}
.girl .arm{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round}

.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pager button{min-height:56px;border:2px solid var(--line);border-radius:16px;background:var(--surface);padding:6px 12px;text-align:left;display:flex;flex-direction:column;justify-content:center;min-width:0}
.pager button:last-child{text-align:right;align-items:flex-end}
.pager small{font-size:.74rem;font-weight:800;color:var(--ink-soft);letter-spacing:.04em;text-transform:uppercase}
.pager span{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* Quiz */
.quiz-intro{padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.rosette{width:150px;height:auto}
.rosette.pop{animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:.5}to{transform:scale(1);opacity:1}}
.shoes{display:flex;gap:3px;flex-wrap:wrap}
.shoes svg{width:26px;height:26px}
.shoes path{fill:none;stroke-width:3.4;stroke-linecap:round;stroke:var(--line)}
.shoes .ok path{stroke:var(--good)}
.shoes .no path{stroke:var(--bad)}
.shoes .cur path{stroke:var(--accent)}
.qhead{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.qcard{padding:20px 16px 16px;display:flex;flex-direction:column;gap:16px}
.qtext{font-size:1.4rem}
.answers{display:flex;flex-direction:column;gap:10px}
.ans{min-height:56px;border:2px solid var(--line);border-radius:16px;background:var(--surface);text-align:left;padding:10px 16px;font-weight:700;display:flex;align-items:center;gap:12px}
.ans b{flex:0 0 auto;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--surface-2);font-size:.86rem}
.ans.is-right{border-color:var(--good);background:var(--good-soft)}
.ans.is-right b{background:var(--good);color:var(--surface)}
.ans.is-wrong{border-color:var(--bad);background:var(--bad-soft)}
.ans.is-wrong b{background:var(--bad);color:var(--surface)}
.ans[disabled]{cursor:default;color:var(--ink)}
.qfeed{display:flex;flex-direction:column;gap:12px;border-radius:16px;padding:14px 16px;background:var(--surface-2)}
.qfeed h3{font-size:1.15rem}
.result{padding:24px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}

/* Facts deck */
.factdeck{padding:26px 22px;min-height:260px;display:flex;flex-direction:column;justify-content:space-between;gap:20px;background:var(--gold-soft);border-color:transparent;touch-action:pan-y}
.fact-num{font-family:var(--font-display);font-weight:800;font-size:1rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.fact-text{font-family:var(--font-display);font-weight:600;font-variation-settings:"opsz" 36;font-size:1.32rem;line-height:1.3;text-wrap:pretty}
.deck-nav{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.swipe-hint{font-size:.86rem;color:var(--ink-soft);text-align:center}

/* School */
.topic{overflow:hidden}
.topic > summary{list-style:none;display:flex;align-items:center;gap:12px;padding:16px 16px;cursor:pointer}
.topic > summary::-webkit-details-marker{display:none}
.topic > summary .t{flex:1;min-width:0}
.topic > summary .t p{font-size:.88rem;color:var(--ink-soft);font-weight:600;margin-top:2px}
.chev{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;transition:transform .2s}
.chev svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.topic[open] .chev{transform:rotate(180deg)}
.topic-body{padding:0 16px 18px;display:flex;flex-direction:column;gap:14px}
.gait{border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 14px;align-items:start}
.gait p{font-size:.95rem}
.gait .tag{font-size:.8rem;font-weight:800;color:var(--accent)}

.hooves::before{content:"eleje";position:absolute;top:0;left:0;right:0;text-align:center;font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft)}
.hooves span{display:grid;place-items:center;width:40px;height:40px;border-radius:50% 50% 44% 44%;background:var(--surface-2);font-size:.72rem;font-weight:800;transition:background .08s, transform .08s}
.hooves span.on{background:var(--accent);color:var(--accent-ink);transform:scale(1.12)}
.gait .btn{grid-column:1/-1;min-height:44px}
.legend{font-size:.84rem;color:var(--ink-soft)}
.parts{width:100%;height:auto;display:block;border-radius:16px;background:linear-gradient(var(--sky), var(--sky-2))}
.pdot{cursor:pointer}
.pdot circle{fill:var(--surface);stroke:var(--accent);stroke-width:1.6}

.pdot.on circle{fill:var(--accent)}
.pdot.on text{fill:var(--accent-ink)}
.partcap{border-radius:14px;background:var(--surface-2);padding:12px 14px;min-height:72px}
.partcap b{font-family:var(--font-display);font-size:1.1rem}
.partlist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.partlist button{min-height:40px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-size:.82rem;font-weight:800;padding:4px 6px;text-align:left;display:flex;gap:6px;align-items:center;min-width:0}
.partlist button span{color:var(--ink-soft);font-variant-numeric:tabular-nums}
.partlist button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.coats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.coat{border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0}

.coat div.c{padding:8px 10px 12px;display:flex;flex-direction:column;gap:2px}
.coat p{font-size:.84rem;line-height:1.35;color:var(--ink-soft)}

.steps b{display:block}
.tip{background:var(--gold-soft);border-radius:14px;padding:12px 14px;font-weight:700;font-size:.95rem}
.kv{display:flex;flex-direction:column}
.kv > div{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:12px;padding:10px 0;border-top:1px solid var(--line)}

.kv dd{margin:0;color:var(--ink-soft);font-weight:600}

.rules li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;font-weight:600}

.lv-shoes .m1 path{stroke:var(--good)}
.lv-shoes .m2 path{stroke:var(--gold)}
.lv-shoes .m3 path{stroke:var(--accent)}

.timeline li:last-child{padding-bottom:0}

 {l:1, q:'Mi a fogathajtás?', a:['Verseny lovak húzta kocsival','Lovak úszóversenye','Ugrás akadályokon'], c:0, e:'Lehet egyes-, kettes- vagy négyesfogat is.'},
 {l:1, q:'Mi a futószár?', a:['Hosszú szár, amin a ló körbe dolgozik az ember körül','A kantár egyik része','Egy nyeregfajta'], c:0, e:'Futószáron a ló lovas nélkül is mozoghat és tanulhat.'},
 {l:1, q:'Ki tesz patkót a lóra?', a:['A patkolókovács','Az állatorvos','Az edző'], c:0, e:'A patkolókovács a patát is igazítja, ha a ló nem kap patkót.'},
 {l:1, q:'Mit jelent, ha a ló munka közben nyalogat és rág?', a:['Ellazult, oldódik a feszültsége','Éhes','Mérges'], c:0, e:'Az edzők ezt jó jelnek tartják: a ló megértette a feladatot.'},
 {l:1, q:'Mit jelent, ha a ló az egyik hátsó lábát lazán felhúzva pihenteti?', a:['Kényelmesen pihen','Rúgni készül','Fáj a lába'], c:0, e:'Ez a pihenő testtartás. Ha viszont egy mellső lábát kíméli, az fájdalomra utalhat.'},
 {l:1, q:'Adhatsz-e a lónak csokoládét?', a:['Nem, árt neki','Igen, szereti','Csak ünnepnapon'], c:0, e:'A csokoládé mérgező a lovaknak.'},
 {l:1, q:'Milyen állat a ló a természetben?', a:['Menekülő állat','Ragadozó','Magányos vadász'], c:0, e:'Veszély esetén elfut. Ezért fontos, hogy körülötte nyugodtan viselkedj.'},
 {l:1, q:'Szeret-e a ló egyedül élni?', a:['Nem, csapatban érzi jól magát','Igen, egyedül a legjobb','Mindegy neki'], c:0, e:'A ló ménesállat. Ha nincs mellette ló társ, legalább lássa a többi lovat.'},
 {l:1, q:'Mire való a nyeregalátét?', a:['Védi a ló hátát, és felszívja az izzadságot','Díszíti a lovat','Melegen tartja a lovast'], c:0, e:'Mindig tisztának és simának kell lennie, hogy ne törje fel a ló hátát.'},
 {l:1, q:'Mibe teszed a lábad lovaglás közben?', a:['A kengyelbe','A hevederbe','A szárba'], c:0, e:'A kengyelben a lábad elülső része legyen, ne az egész talpad.'},
 {l:1, q:'Melyik a lovas felszerelése, nem a lóé?', a:['Kobak','Nyeregalátét','Kantár'], c:0, e:'A lovas felszereléséhez tartozik még a lovaglócsizma, a kesztyű és a gerincvédő is.'},
 {l:1, q:'Mire való a kötőfék?', a:['Vezetésre és kikötésre','Ugratásra','Díjlovaglásra'], c:0, e:'A kötőféken nincs zabla, ezért a lónak kényelmes.'},
 {l:1, q:'Négy egyenletes dobbanást hallasz. Milyen jármódban halad a ló?', a:['Lépésben','Ügetésben','Vágtában'], c:0, e:'Lépésben a négy láb egymás után ér a földre.'},
 {l:1, q:'Mit tegyél, ha a ló megijed melletted?', a:['Maradj nyugodt, és beszélj hozzá halkan','Sikíts','Fuss el előle'], c:0, e:'A ló érzi, ha te nyugodt vagy, és ez őt is megnyugtatja.'},
 {l:1, q:'Kb. hány hónapig vemhes a kanca?', a:['11 hónapig','3 hónapig','2 évig'], c:0, e:'A vemhesség kb. 11 hónap, tovább tart, mint az embernél.'},
 {l:1, q:'Mennyi idő után áll fel az újszülött csikó?', a:['Kb. egy órán belül','Egy nap múlva','Egy hét múlva'], c:0, e:'Menekülő állatként a csikónak gyorsan követnie kell az anyját.'},
 {l:1, q:'Mi a mar?', a:['A nyak és a hát találkozása','A ló orra','A pata alja'], c:0, e:'A nyereg közvetlenül a mar mögé kerül.'},
 {l:1, q:'Mi a lovarda?', a:['Fedett vagy nyitott pálya lovagláshoz','Lovas étterem','Egy lófajta'], c:0, e:'Fedett lovardában rossz időben is lehet lovagolni.'},
 {l:1, q:'Mi a ménes?', a:['Lovak csapata, egy tenyésztelepen','Egy nyeregfajta','Egy lovas sportág'], c:0, e:'Magyarországon híres ménes van például Mezőhegyesen, Bábolnán és Szilvásváradon.'},
 {l:1, q:'Mikor ellenőrzöd a hevedert?', a:['Felszállás előtt, és pár perc lovaglás után újra','Csak lovaglás után','Soha'], c:0, e:'Néhány ló nyergeléskor felfújja a hasát, ezért a heveder később meglazulhat.'},
 {l:1, q:'Mi a patkó?', a:['Fémpánt a pata alján, ami védi a patát','Egy lófajta','A kantár része'], c:0, e:'Nem minden ló kap patkót. Erős patájú lovak patkó nélkül is jól dolgoznak.'},
 {l:1, q:'Hány ló húzza a négyesfogatot?', a:['4','2','6'], c:0, e:'A négyesfogatban két ló elöl, kettő hátul halad.'},

 /* ---------- KÖZEPES ---------- */
 {l:2, q:'Hány ütemű a lépés?', a:['4','3','2'], c:0, e:'Lépésben a négy láb egymás után ér a földre.'},

 {l:2, q:'Hány ütemű a vágta?', a:['3','2','4'], c:0, e:'Három dobbanás után egy pillanatra mind a négy láb a levegőben van.'},
 {l:2, q:'Ügetésben melyik lábak lépnek együtt?', a:['Az átlós lábpárok','Az egy oldalon lévő lábak','A két első láb'], c:0, e:'A bal első a jobb hátsóval, a jobb első a bal hátsóval lép együtt.'},
 {l:2, q:'Mi a könnyítés ügetésben?', a:['A lovas ütemesen felemelkedik és visszaül a nyeregbe','A ló lassít','A lovas leszáll'], c:0, e:'Könnyítéssel kíméljük a ló hátát, és a lovasnak is kényelmesebb.'},
 {l:2, q:'Könnyítő ügetésben mikor emelkedsz fel?', a:['Amikor a ló külső mellső lába előre lép','Amikor a belső hátsó lába lép','Mindegy'], c:0, e:'Ezt hívják jó lábon könnyítésnek. Kézváltáskor egy ütemig ülve maradsz, és így váltasz.'},
 {l:2, q:'Bal kézen lovagolsz. Merre van a pálya közepe?', a:['Balra tőled','Jobbra tőled','Mögötted'], c:0, e:'Bal kézen a bal kezed van belül, és az óramutatóval ellentétesen haladsz.'},
 {l:2, q:'Jobb kézen vágtázol. Melyik mellső lábával vezessen a ló?', a:['A jobb (belső) első lábával','A bal első lábával','Mindegy'], c:0, e:'Kanyarban a belső lábával vezetve marad egyensúlyban.'},
 {l:2, q:'Melyek a lovas természetes segítségei?', a:['Comb, szár, súly (ülés) és hang','Pálca és sarkantyú','Csak a szár'], c:0, e:'A pálca és a sarkantyú mesterséges segítség.'},
 {l:2, q:'Melyik mesterséges segítség?', a:['Pálca','Comb','Súly'], c:0, e:'A pálca és a sarkantyú csak a combsegítséget erősíti meg, nem büntetésre való.'},
 {l:2, q:'Hogyan indítod lépésbe a lovat?', a:['Mindkét combbal enyhén nyomod, és engedsz a szárral','Rántasz a száron','Hátradőlsz'], c:0, e:'Ha engedsz a szárral, a ló tudja, hogy előre mehet.'},
 {l:2, q:'Hogyan állítod meg a lovat?', a:['Mély üléssel, combbal és finoman záró szárral','Erősen rántasz a száron','Előre dőlsz'], c:0, e:'Ez a teljes parádé. A jó megállás az ülésből és a combból indul, nem csak a kézből.'},
 {l:2, q:'Mi a félparádé?', a:['Rövid, finom jelzés, amellyel a lovas a ló figyelmét kéri','Fél kör a pályán','Egy ugrásfajta'], c:0, e:'Félparádéval készíted fel a lovat egy változásra, például jármódváltásra.'},
 {l:2, q:'Mi a könnyű ülés (ugróülés)?', a:['A lovas kicsit felemelkedik a nyeregből és előrehajol','A lovas hátradől','A lovas kengyel nélkül ül'], c:0, e:'Ugratásnál és terepen így nem terheled a ló hátát.'},
 {l:2, q:'Hol legyen a sarkad lovaglás közben?', a:['Lefelé, a lábujjad feljebb','Felfelé','A ló hasán'], c:0, e:'A mélyre engedett sarok segít, hogy stabilan ülj.'},
 {l:2, q:'Helyes ülésben mi van egy függőleges vonalban, oldalról nézve?', a:['Fül, váll, csípő, sarok','Fej, térd, lábujj','Kéz, könyök, térd'], c:0, e:'Ha ez a vonal egyenes, egyensúlyban ülsz a ló fölött.'},
 {l:2, q:'Mi a volt?', a:['6–10 méter átmérőjű kis kör','20 méteres kör','Egy ugrás'], c:0, e:'A 20 méteres kör a nagy kör, ennél kisebb a volt.'},
 {l:2, q:'Mi a kézváltás?', a:['Irányváltás, például átlón keresztül','A szár átadása másnak','A lovasok cseréje'], c:0, e:'Kézváltás után a másik kezed lesz belül.'},
 {l:2, q:'Mekkora a kisebb díjlovagló négyszög?', a:['20 × 40 m','10 × 20 m','50 × 100 m'], c:0, e:'A nagy négyszög 20 × 60 méteres.'},
 {l:2, q:'Melyik betű van a díjlovagló négyszög közepén?', a:['X','A','C'], c:0, e:'Az X a középvonalon, a négyszög pontos közepén van.'},
 {l:2, q:'Melyik betűnél lovagolsz be a díjlovagló négyszögbe?', a:['A','C','X'], c:0, e:'A C betűnél ül a főbíró.'},
 {l:2, q:'Díjlovaglásban legfeljebb hány pontot kaphat egy feladat?', a:['10','5','100'], c:0, e:'Minden feladatot 0-tól 10-ig pontoznak.'},
 {l:2, q:'Díjugratásban hány hibapontot ér egy leverés?', a:['4','1','10'], c:0, e:'Az első megtagadás is 4 hibapont.'},
 {l:2, q:'Mi a megtagadás díjugratásban?', a:['A ló megáll az akadály előtt vagy kitér előle','A lovas leszáll','A ló túl gyors'], c:0, e:'Az első megtagadás 4 hibapontot ér.'},
 {l:2, q:'Mi a parkúr?', a:['Az akadályok sora egy díjugrató versenyen','Lovas park','Egy nyeregfajta'], c:0, e:'A lovasok verseny előtt gyalog bejárják a parkúrt, hogy megtervezzék az utat.'},
 {l:2, q:'Mi az oxer?', a:['Széles akadály két rúdsorral egymás mögött','Egyszerű függőleges akadály','Vizesárok'], c:0, e:'Az oxer magas és széles is, ezért nagyobb lendület kell hozzá.'},
 {l:2, q:'Mi a kombináció díjugratásban?', a:['Két vagy három akadály egymás után, rövid távolságban','Két lovas egy lovon','Egy ugrás két lóval'], c:0, e:'Az elemeket A, B és C betűvel jelölik.'},
 {l:2, q:'Melyik három szám alkotja a lovastusát?', a:['Díjlovaglás, terepverseny, díjugratás','Úszás, futás, lovaglás','Fogathajtás, galopp, póló'], c:0, e:'Ugyanaz a ló és lovas teljesíti mindhárom számot.'},
 {l:2, q:'Mi történik távlovaglásban az állatorvosi kapuban?', a:['Az állatorvos ellenőrzi a ló pulzusát és mozgását','A lovas eszik','Lovat cserélnek'], c:0, e:'Csak egészséges, jól bíró ló mehet tovább.'},
 {l:2, q:'Mi a lovastorna (voltizs)?', a:['Tornagyakorlatok a futószáron vágtázó lovon','A ló reggeli tornája','Gyaloglás a ló mellett'], c:0, e:'A lovat futószáron vezeti a futószáras, a tornászok a hátán gyakorolnak.'},
 {l:2, q:'Melyik lovaglási stílusban van szarv a nyereg elején, és fogja a lovas egy kézben a szárat?', a:['Western','Díjlovaglás','Díjugratás'], c:0, e:'A western stílus a cowboyok munkájából alakult ki.'},
 {l:2, q:'Mi a csikózabla?', a:['Egyszerű, a leggyakrabban használt zablafajta','Csikóknak való játék','Kantár zabla nélkül'], c:0, e:'Kezdő és fiatal lovaknál is ezt használják. Gyakran középen csuklós.'},
 {l:2, q:'Mi a martingál?', a:['Segédszár, amely megakadályozza, hogy a ló túl magasra emelje a fejét','Nyeregfajta','Patkófajta'], c:0, e:'Ugratásnál és terepen gyakran használják.'},
 {l:2, q:'Melyik nyeregnek van mély ülése és hosszú, egyenes szárnya?', a:['Díjlovagló nyereg','Ugrónyereg','Western nyereg'], c:0, e:'A hosszú szárny miatt a lovas lába hosszan, mélyen simul a lóhoz.'},
 {l:2, q:'Melyik nyeregnek van előre döntött szárnya térdpárnákkal?', a:['Ugrónyereg','Díjlovagló nyereg','Western nyereg'], c:0, e:'Ugratáshoz rövidebb kengyellel lovagolunk, ezért kell előrébb a térdpárna.'},
 {l:2, q:'Hogyan becsülöd meg a kengyelszíj hosszát a földön állva?', a:['A kinyújtott karod hossza nagyjából megegyezik vele','Megméred a lábad','A ló magasságából'], c:0, e:'Ujjhegyed a kengyelszíj csatjánál van, a kengyel a hónaljadig ér.'},
 {l:2, q:'Mire jó a futószárazás?', a:['A ló mozgatására és képzésére lovas nélkül','Versenyzésre','Patkolásra'], c:0, e:'Kezdő lovasok is tanulhatnak futószáron, mert ott az edző irányítja a lovat.'},
 {l:2, q:'Kb. hány kg szénát eszik naponta egy 500 kg-os ló?', a:['7,5–10 kg','1 kg','50 kg'], c:0, e:'A ló a testtömege kb. 1,5–2%-ának megfelelő szénát eszik naponta.'},
 {l:2, q:'Miért kell a lovat naponta többször, kis adagokkal etetni?', a:['Mert a gyomra kicsi','Mert lassan rág','Mert este nem lát'], c:0, e:'A ló gyomra csak kb. 8–15 literes.'},
 {l:2, q:'Mennyi ideig várj etetés után a lovaglással?', a:['Kb. egy órát','Egyáltalán nem kell','Egy napot'], c:0, e:'Teli gyomorral a munka megterheli a lovat.'},
 {l:2, q:'Miért veszélyes a lenyírt fű kupacban?', a:['Gyorsan erjed, és kólikát okozhat','Túl édes','Szúrós'], c:0, e:'Ezért soha ne add oda a lovaknak a fűnyírás után maradt füvet.'},
 {l:2, q:'Mi a kólika?', a:['Hasfájás, ami veszélyes lehet','Egy lófajta','Egy ugrásfajta'], c:0, e:'Kólikánál mindig azonnal állatorvost kell hívni.'},
 {l:2, q:'Melyik lehet a kólika jele?', a:['Kapál, a hasára néz, fetrengeni akar','Vidáman legel','Nyerít'], c:0, e:'Az is gyanús, ha a ló nem eszik, vagy sokszor lefekszik.'},
 {l:2, q:'Mit tegyél, ha kólikát gyanítasz?', a:['Azonnal szólj egy felnőttnek, hogy hívja az állatorvost','Etesd meg','Lovagold meg'], c:0, e:'Amíg az állatorvos megérkezik, ne adj a lónak enni.'},
 {l:2, q:'Mennyi a ló normál testhőmérséklete?', a:['37,5–38,5 °C','35–36 °C','40–41 °C'], c:0, e:'Ha 38,5 °C fölött van, a lónak láza lehet.'},
 {l:2, q:'Mire való a nyalósó?', a:['Sót pótol, amire a lónak szüksége van','Fogmosásra','Díszítésre'], c:0, e:'Melegben és munka után a ló sok sót veszít az izzadással.'},
 {l:2, q:'Mi a nyír?', a:['Rugalmas, háromszög alakú rész a pata alján','A sörény része','Egy kantárszíj'], c:0, e:'A nyír tompítja a lépéseket.'},
 {l:2, q:'Mi a fakó ló?', a:['Homokszínű, sötét sörénnyel, gyakran angolnacsíkkal','Fehér','Pöttyös'], c:0, e:'A norvég fjordló mindig fakó.'},
 {l:2, q:'Mi a csillag a ló fején?', a:['Kis fehér folt a homlokon','Fényes patkó','Sörénydísz'], c:0, e:'A fehér jegyeket a lóútlevélben is feljegyzik.'},
 {l:2, q:'Mi a kesely?', a:['Fehér jegy a ló lábán','Fehér folt a homlokon','Sötét csík a hátán'], c:0, e:'A kesely lehet egészen kicsi, de felérhet a térdig is.'},
 {l:2, q:'Mi a hóka?', a:['Fehér csík a ló orrhátán','Fehér folt a lábon','Fekete sörény'], c:0, e:'Ha a fehér jegy az arc nagy részét befedi, azt lámpásnak hívják.'},
 {l:2, q:'Mit jelent, hogy egy ló „hidegvérű”?', a:['Nagy testű, nyugodt igásló','Hideg a vére','Télen születik'], c:0, e:'A „vérű” a vérmérsékletre utal, nem a vér hőmérsékletére.'},
 {l:2, q:'Melyik melegvérű sportló?', a:['Hannoveri','Shire','Shetlandi póni'], c:0, e:'A legtöbb díjugrató és díjlovagló ló melegvérű.'},
 {l:2, q:'Melyik telivér fajta?', a:['Angol telivér','Haflingi','Fríz'], c:0, e:'Telivér az arab ló is.'},
 {l:2, q:'Hogyan köszönj egy lónak?', a:['Hagyd, hogy megszagolja a kezedet','Öleld meg a fejét','Paskold meg erősen az orrát'], c:0, e:'A lovak is így, egymás orrát megszagolva ismerkednek.'},
 {l:2, q:'Miért alszanak a lovak sokszor állva?', a:['Menekülő állatok, állva gyorsabban el tudnak futni','Mert nem tudnak lefeküdni','Mert fáj a hasuk'], c:0, e:'Mély alváshoz viszont le kell feküdniük.'},
 {l:2, q:'Mi a flehmenezés?', a:['Felhúzott felső ajakkal szagokat „kóstol”','Egy ugrásfajta','A sörény befonása'], c:0, e:'Ilyenkor a ló olyan, mintha nevetne.'},
 {l:2, q:'Nagyjából hány fokban lát körbe a ló?', a:['Majdnem 350 fokban','90 fokban','180 fokban'], c:0, e:'A szeme a feje oldalán van, így csak mögötte és az orra előtt van vakfoltja.'},
 {l:2, q:'Mely színeket különbözteti meg nehezen a ló?', a:['A pirosat és a zöldet','A kéket és a sárgát','A fehéret és a feketét'], c:0, e:'A kéket és a sárgát jól látja.'},
 {l:2, q:'Mennyi ideig melegítsd be lépésben a lovat a lovaglás elején?', a:['Legalább 10 percig','1 percig','Egyáltalán nem kell'], c:0, e:'Az izmoknak és ízületeknek idő kell, hogy felkészüljenek a munkára.'},
 {l:2, q:'Mit csinálsz a lovaglás végén?', a:['Lépésben levezetsz, amíg a ló légzése megnyugszik','Vágta után azonnal beállítod a bokszba','Jéghideg vízzel itatod'], c:0, e:'Az izzadt lovat szárazra kell vezetni, és nem szabad huzatba állítani.'},
 {l:2, q:'Hogyan emeled fel a ló lábát?', a:['Mellé állsz a farka felé nézve, végigsimítasz a lábán, és a csüdnél megemeled','Előle húzod','Megnyomod a hátát'], c:0, e:'Mindig maradj közel a lóhoz, és figyeld, hogy nyugodt-e.'},
 {l:2, q:'Mire való a lábvédő vagy a bandázs?', a:['Védi a ló lábát az ütésektől és sérülésektől','Melegíti a lovast','Díszít'], c:0, e:'Ugratásnál a ló a saját lábát is megütheti.'},
 {l:2, q:'Miért nyírják le egyes sportlovak téli szőrét?', a:['Hogy munka közben ne izzadjanak le túlságosan, és gyorsabban megszáradjanak','Hogy szebbek legyenek','Mert nyáron nő'], c:0, e:'A nyírt lónak hidegben takaró kell.'},
 {l:2, q:'Mi a hippoterápia?', a:['Gyógyító foglalkozás, ahol a ló mozgása segít','Lóverseny','Gyógyszer lovaknak'], c:0, e:'A ló lépésének ritmusa a lovas izmait és egyensúlyát fejleszti.'},
 {l:2, q:'Hány lovas játszik egy lovaspóló-csapatban?', a:['4','11','2'], c:0, e:'A lovakat a meccs közben többször is cserélik.'},

let UID = 0;
const HOOF = '#3B312B';
function shade(hex, amt){
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const t = amt < 0 ? 0 : 255, p = Math.abs(amt);
  r = Math.round((t - r) * p + r); g = Math.round((t - g) * p + g); b = Math.round((t - b) * p + b);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

  const body = [
    mk('circle', `cx="70" cy="${cy - 1}" r="${R + 1}"`, coat),

  if (s.pattern === 'roan'){ const r = rng(11); for (let i = 0; i < 320; i++){ ov += `<circle cx="${(40 + r() * 146).toFixed(1)}" cy="${(py + r() * (cy + R + 6 - py)).toFixed(1)}" r="${(0.8 + r() * 0.7).toFixed(1)}" fill="#fff" fill-opacity=".55"/>`; } }

function pickQs(l, n){

  return pool.slice(0, n);
}

let actx = null;
function audio(){
  try { if (!actx){ const C = window.AudioContext || window.webkitAudioContext; if (C) actx = new C(); } if (actx && actx.state === 'suspended') actx.resume(); } catch (e) { actx = null; }
  return actx;
}
function clop(t, hi){
  const a = actx; if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = 'triangle'; o.frequency.setValueAtTime(hi ? 260 : 210, t); o.frequency.exponentialRampToValueAtTime(70, t + 0.09);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.55, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.15);
  const len = Math.floor(a.sampleRate * 0.035), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g2 = a.createGain();
  src.buffer = buf; f.type = 'bandpass'; f.frequency.value = 1700; g2.gain.value = 0.4;
  src.connect(f); f.connect(g2); g2.connect(a.destination); src.start(t);
}
function playGait(id, btn){
  const g = GAITS.find(x => x.id === id), a = audio(), strides = 4, t0 = a ? a.currentTime + 0.08 : 0;
  const box = $(`.hooves[data-g="${id}"]`);
  btn.disabled = true;
  for (let s = 0; s < strides; s++) g.seq.forEach((b, k) => {
    const at = s * g.period + b[0];
    if (a) b[1].forEach((_, j) => clop(t0 + at + j * 0.004, k === 0));
    setTimeout(() => { b[1].forEach(f => { const el = $(`[data-f="${f}"]`, box); if (el){ el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 170); } }); }, 80 + at * 1000);
  });
  setTimeout(() => { btn.disabled = false; }, 80 + strides * g.period * 1000 + 200);
}

/* ---------------- Navigáció ---------------- */
function setTab(tab){
  state.tab = tab;
  $$('.view').forEach(v => { v.hidden = v.id !== 'view-' + tab; });
  $$('.tab').forEach(t => { if (t.dataset.tab === tab) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current'); });
  if (tab === 'home') renderHome();
  if (tab === 'breeds') renderBreeds();
  if (tab === 'quiz') renderQuiz();
  if (tab === 'facts') renderFacts();
  if (tab === 'school' && !$('#view-school').innerHTML) renderSchool();
  window.scrollTo(0, 0);
}
function openBreed(id){
  if (state.tab === 'breeds' && !state.detail) state.listScroll = window.scrollY;
  state.detail = id;
  if (!state.seen.has(id)){ state.seen.add(id); store.set('seen', Array.from(state.seen)); }
  if (state.tab !== 'breeds') setTab('breeds'); else { renderBreeds(); window.scrollTo(0, 0); }
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act;
  if (act === 'tab'){ if (t.dataset.tab === 'breeds' && state.tab === 'breeds') state.detail = null; if (t.dataset.tab === 'quiz' && state.tab === 'quiz' && Q.done){ Q.started = false; } setTab(t.dataset.tab); }
  else if (act === 'open') openBreed(t.dataset.id);
  else if (act === 'back'){ state.detail = null; renderBreeds(); window.scrollTo(0, state.listScroll || 0); }
  else if (act === 'fav'){
    const id = t.dataset.id; if (state.favs.has(id)) state.favs.delete(id); else state.favs.add(id);
    store.set('favs', Array.from(state.favs));
    const on = state.favs.has(id);
    $$(`.fav[data-id="${id}"]`).forEach(b => b.setAttribute('aria-pressed', on));
    if (state.tab === 'breeds' && !state.detail && state.filter === 'fav') renderBreedGrid();
  }
  else if (act === 'filter'){ state.filter = t.dataset.f; $$('.chip[data-act="filter"]').forEach(c => c.setAttribute('aria-pressed', c === t)); renderBreedGrid(); }
  else if (act === 'region'){ state.region = t.dataset.r; $$('.chip[data-act="region"]').forEach(c => c.setAttribute('aria-pressed', c === t)); renderBreedGrid(); }
  else if (act === 'type-go'){ state.filter = t.dataset.f; state.region = 'all'; state.query = ''; state.detail = null; setTab('breeds'); }
  else if (act === 'fcat'){ state.fcat = t.dataset.c; state.fi = 0; renderFacts(); }
  else if (act === 'settings'){ state.showSettings = !state.showSettings; renderHome(); if (state.showSettings) $('#set-name').focus(); }
  else if (act === 'settings-home'){ state.showSettings = true; setTab('home'); }
  else if (act === 'h-' || act === 'h+'){ const inp = $('#set-height'); inp.value = clamp((+inp.value || 140) + (act === 'h+' ? 1 : -1), 80, 200); }
  else if (act === 'fact-more'){ state.factBump++; renderHome(); }
  else if (act === 'quiz-go'){ Q.started = false; setTab('quiz'); }
  else if (act === 'q-start') startQuiz(t.dataset.l);
  else if (act === 'q-ans') answer(+t.dataset.i);
  else if (act === 'q-next') nextQ();
  else if (act === 'q-quit'){ Q.started = false; renderQuiz(); }
  else if (act === 'f-step') stepFact(+t.dataset.d);
  else if (act === 'f-rand'){ const n = factList().length; if (n > 1){ let k; do { k = Math.floor(Math.random() * n); } while (k === state.fi); state.fi = k; } renderFacts(); }
  else if (act === 'part') setPart(+t.dataset.i);
  else if (act === 'gait') playGait(t.dataset.g, t);
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'settings-form') return;
  e.preventDefault();
  state.name = $('#set-name').value.trim().slice(0, 20) || 'Juli';
  state.height = clamp(Math.round(+$('#set-height').value || 140), 80, 200);
  store.set('name', state.name); store.set('height', state.height); store.set('hset', true);
  state.showSettings = false; renderHome();
});
document.addEventListener('input', e => { if (e.target.id === 'breed-search'){ state.query = e.target.value; renderBreedGrid(); } });
let tx0 = null;
document.addEventListener('touchstart', e => { tx0 = e.target.closest('#factdeck') ? e.touches[0].clientX : null; }, {passive:true});
document.addEventListener('touchend', e => { if (tx0 == null) return; const dx = e.changedTouches[0].clientX - tx0; tx0 = null; if (Math.abs(dx) > 50) stepFact(dx < 0 ? 1 : -1); }, {passive:true});

function start(data){
  data = data || {};
  if (data.detail) state.detail = data.detail;
  if (data.fi != null) state.fi = data.fi;
  setTab(data.tab || 'home');
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({tab: state.tab, detail: state.detail, fi: state.fi}));
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
